name: Python 3 CI

on:
  push:
    branches:
    - master
    - '*_develop'
  pull_request: {}
jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: run commit title format check
      run: |
        ./tools/ci/check_for_commit_message.sh

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        # This path is specific to Ubuntu
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('desktop/core/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-

    - name: Setup node 20 and cache npm
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: compile
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc libkrb5-dev libldap2-dev libsasl2-dev libxslt-dev libsasl2-modules-gssapi-mit libsnappy-dev libgdbm-dev

        export PYTHON_VER=python${{ matrix.python-version }}
        export SKIP_PYTHONDEV_CHECK=true
        export ROOT=$PWD
        make apps
        npm run webpack-login
        ./build/env/bin/hue collectstatic --noinput

    - name: write test hue.ini
      run: |
        cat > desktop/conf/hue.ini <<'EOF'
        [desktop]

          [[ozone]]
            [[[default]]]
              fs_defaultfs=ofs://localhost:9862
              webhdfs_url=http://localhost:9778/webhdfs/v1

        [hadoop]

          [[hdfs_clusters]]
            [[[default]]]
              fs_defaultfs=hdfs://localhost:8020
              webhdfs_url=http://localhost:14000/webhdfs/v1

          [[yarn_clusters]]
            [[[default]]]
              submit_to=true
              resourcemanager_api_url=http://localhost:8088
              history_server_api_url=http://localhost:19888

        [azure]

          [[abfs_clusters]]
            [[[default]]]
              fs_defaultfs=abfs://container@account.dfs.core.windows.net

        [beeswax]
          hive_server_host=localhost
        EOF

    - name: run tests
      run: |
        mkdir -p test-reports  # Ensure the directory exists
        PYTHONWARNINGS=always ./build/env/bin/pytest --html=test-reports/report_${{ matrix.python-version }}.html --self-contained-html

    - name: upload pytest report
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.python-version }}
        path: test-reports

    - name: Check and comment if no unit test files are modified
      if: github.event_name == 'pull_request'
      run: |
        git fetch origin ${{ github.base_ref }}
        changed_files=$(git diff --name-only origin/${{ github.base_ref }})

        if echo "$changed_files" | grep -qE '(^test|_test\.py|^tests|_tests\.py|.test)'; then
          echo "✅ Unit test files were modified."
        else
          echo "⚠️ No unit test files modified."

          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"body":"⚠️ No unit test files modified. Please ensure that changes are properly tested. ⚠️"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
        fi

    - name: run python lints
      run: |
        PYTHONWARNINGS=always ./build/env/bin/hue runruff check

    - name: run documentation lints
      run: |
        curl -O https://dl.google.com/go/go1.23.4.linux-amd64.tar.gz
        tar -xvf go1.23.4.linux-amd64.tar.gz
        go/bin/go install github.com/raviqqe/muffet/v2@latest

        curl --output hugo_0.69.0_Linux.tar.gz -L https://github.com/gohugoio/hugo/releases/download/v0.69.0/hugo_0.69.0_Linux-64bit.tar.gz
        tar -xvf hugo_0.69.0_Linux.tar.gz

        export PATH=$PWD:$HOME/go/bin:$PATH

        # Trigger linting if documentation changes
        ./tools/ci/check_for_website_dead_links.sh docs/docs-site
        # ./tools/ci/check_for_website_dead_links.sh docs/gethue
